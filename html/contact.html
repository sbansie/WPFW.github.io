<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactformulier van Shriya.">
    <title>Contact | Shriya</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/contact.js" defer></script>
</head>
<body>
<header>
    <nav class="navbar" aria-label="Hoofdnavigatie">
        <a href="index.html" class="logo">SHRIYA<span>.DEV</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Whoami</a></li>
            <li><a href="projects.html">Projecten</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-header" aria-labelledby="contact-title">
        <p>CONTACT</p>
        <h1 id="contact-title">Neem contact op.</h1>
        <p>Vul het formulier in. JavaScript controleert de invoer voordat het formulier wordt verwerkt.</p>
    </section>

    <section class="contact-section" aria-labelledby="form-title">
        <h2 id="form-title">Contactformulier</h2>
        <form id="contact-form" class="contact-form" novalidate>
            <div class="form-group">
                <label for="name">Naam</label>
                <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
                <p id="name-error" class="form-error" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error">
                <p id="email-error" class="form-error" aria-live="polite"></p>
            </div>

            <div class="form-group">
                <label for="message">Bericht</label>
                <textarea id="message" name="message" rows="6" aria-describedby="message-error"></textarea>
                <p id="message-error" class="form-error" aria-live="polite"></p>
            </div>

            <button type="submit" class="btn primary-btn">Versturen</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
    </section>
</main>

<footer>
    <div class="footer-content">
        <a href="index.html" class="logo">SHRIYA<span>.DEV</span></a>
        <p>© 2026 Shriya.</p>
    </div>
</footer>
</body>
</html>
